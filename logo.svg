<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
<style>
.b{transform-box:fill-box;transform-origin:bottom;animation:g 1.2s ease-out both}
.b2{animation-delay:.15s}.b3{animation-delay:.3s}
@keyframes g{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.l{stroke-dasharray:140;stroke-dashoffset:140;animation:d 1s .6s ease-out forwards}
@keyframes d{to{stroke-dashoffset:0}}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f6b3f"/><stop offset="1" stop-color="#2bb673"/></linearGradient></defs>
<rect width="120" height="120" rx="28" fill="url(#g)"/>
<rect class="b" x="26" y="68" width="16" height="26" rx="4" fill="#fff" opacity=".95"/>
<rect class="b b2" x="52" y="54" width="16" height="40" rx="4" fill="#fff" opacity=".95"/>
<rect class="b b3" x="78" y="38" width="16" height="56" rx="4" fill="#fff" opacity=".95"/>
<path class="l" d="M24 52 L50 38 L66 44 L98 22" fill="none" stroke="#ffe08a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
