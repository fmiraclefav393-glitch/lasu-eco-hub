<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.bl{transform-origin:100px 152px;animation:ol .9s cubic-bezier(.22,1,.36,1) forwards}
.br{transform-origin:100px 152px;animation:or .9s cubic-bezier(.22,1,.36,1) forwards}
.bs{opacity:0;animation:fi .4s ease-out .1s forwards}
.gc{opacity:0;transform:translateY(12px);animation:cr .5s cubic-bezier(.34,1.56,.64,1) .5s forwards}
.tl{stroke-dasharray:180 400;stroke-dashoffset:190;animation:dt .8s cubic-bezier(.45,0,.25,1) .8s forwards}
.ta{opacity:0;transform-origin:162px 54px;transform:scale(.4);animation:pa .3s cubic-bezier(.34,1.56,.64,1) 1.5s forwards}
@keyframes ol{0%{opacity:0;transform:scaleX(.15) skewY(18deg)}100%{opacity:1;transform:scaleX(1) skewY(0deg)}}
@keyframes or{0%{opacity:0;transform:scaleX(.15) skewY(-18deg)}100%{opacity:1;transform:scaleX(1) skewY(0deg)}}
@keyframes cr{to{opacity:1;transform:translateY(0)}}
@keyframes dt{to{stroke-dashoffset:0}}
@keyframes pa{to{opacity:1;transform:scale(1)}}
@keyframes fi{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
</style>
