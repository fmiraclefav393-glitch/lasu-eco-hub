*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0}

nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;white-space:nowrap;padding:10px 16px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:14px;font-weight:600}
nav button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.b{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.h{color:var(--ok)}.c{color:var(--no)}.m{color:var(--mv)}.n{color:var(--mu)}
input,select,.btn{width:100%;padding:11px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.btn{background:var(--ac);color:var(--bg);font-weight:700;border:0;cursor:pointer}
.btn.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.code{font-size:34px;font-weight:800;letter-spacing:6px;text-align:center;color:var(--ac)}
.msg{font-size:14px;margin:6px 0;min-height:18px}
.warn{background:var(--card);border:1px solid var(--mv);color:var(--mv);padding:10px;border-radius:10px;font-size:14px}
small{color:var(--mu)}
[hidden]{display:none!important}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg);transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:150px;height:150px;filter:drop-shadow(0 14px 26px rgba(17,87,52,.28));animation:pop .45s ease-out both}
#splash h2{margin:6px 0 0;font-size:22px;animation:rise .6s .3s both}
#splash p{margin:0;color:var(--mu);font-size:14px;animation:rise .6s .5s both}
.bar{width:120px;height:4px;border-radius:9px;background:var(--bd);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:40%;background:var(--ac);animation:slide 1.1s ease-in-out infinite}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
@media(prefers-reduced-motion:reduce){#splash *{animation:none!important}}
.glass{background:rgba(127,127,127,.16);background:color-mix(in srgb,var(--card) 62%,transparent);-webkit-backdrop-filter:blur(12px) saturate(1.5);backdrop-filter:blur(12px) saturate(1.5);border:1px solid rgba(127,127,127,.3);box-shadow:0 6px 20px rgba(0,0,0,.16)}

.pop{position:absolute;right:0;top:50px;z-index:30;display:flex;gap:6px;padding:6px;border-radius:18px;transform-origin:top right;animation:popin .18s ease-out}
.opt{width:44px;height:44px;padding:0;border-radius:13px;border:1px solid transparent;background:transparent;color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer}
.opt.on{background:rgba(127,127,127,.22);border-color:var(--ac);color:var(--ac)}
@keyframes popin{from{opacity:0;transform:scale(.9) translateY(-4px)}to{opacity:1;transform:none}}
.sun.play .ray{animation:shoot .8s ease-in-out}
@keyframes shoot{0%{transform:translate(0,0);opacity:1}38%{transform:translate(calc(var(--dx)*5px),calc(var(--dy)*5px));opacity:0}39%{transform:translate(calc(var(--dx)*-5px),calc(var(--dy)*-5px));opacity:0}100%{transform:translate(0,0);opacity:1}}
.sun.play .core{transform-origin:12px 12px;animation:beat .8s ease-in-out}
@keyframes beat{40%{transform:scale(1.2)}100%{transform:scale(1)}}
.moon .st{fill:currentColor;stroke:none;transform-origin:0 0}
.moon.play .crescent{transform-origin:12px 12px;animation:rock .8s ease-in-out}
@keyframes rock{0%{transform:rotate(0)}30%{transform:rotate(-18deg)}65%{transform:rotate(10deg)}100%{transform:rotate(0)}}
.moon.play .st{animation:twinkle .8s ease-in-out both}
.moon.play .s2{animation-delay:.12s}.moon.play .s3{animation-delay:.24s}
@keyframes twinkle{0%{transform:scale(1)}35%{transform:scale(2.3) rotate(45deg)}100%{transform:scale(1) rotate(90deg)}}
.auto.play .half{transform-origin:12px 12px;animation:coin .8s cubic-bezier(.5,0,.2,1)}
@keyframes coin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.sun *,.moon *,.auto *,.zap *,.pop{animation:none!important}}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,doc,collection,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot,query,where,getDocs,deleteField} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";

const COURSES=[["ECO 301","Intermediate Microeconomics 1"],["ECO 331","Intermediate Macroeconomics 1"],["ECO 305","History of Economic Thought"],["ECO 307","Project Evaluation"],["SSC 301","Innovation in Social Science"],["ECO 311","Mathematics for Economist III"],["ECO 317","Environmental Economics"],["ECO 319","Statistics for Economists II"],["ECO 337","International Trade"],["ECO 303","Applied Monetary Economics"]];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tm=t=>new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hour12:true});
const t0=new Date().setHours(0,0,0,0);
const opts=COURSES.map(c=>`<option value="${c[0]}">${c[0]} · ${c[1]}</option>`).join("");
$("ac").innerHTML=opts;
{
  const SUN=`<svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle class="core" cx="12" cy="12" r="4"/>${[0,1,2,3,4,5,6,7].map(k=>{const a=k*Math.PI/4,c=Math.cos(a),d=Math.sin(a);return `<line class="ray" style="--dx:${c.toFixed(2)};--dy:${d.toFixed(2)}" x1="${(12+7*c).toFixed(2)}" y1="${(12+7*d).toFixed(2)}" x2="${(12+9.6*c).toFixed(2)}" y2="${(12+9.6*d).toFixed(2)}"/>`}).join("")}</svg>`;
  const STAR="M0-2L.6-.6 2 0 .6.6 0 2-.6.6-2 0-.6-.6z";
  const MOON=`<svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path class="crescent" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/><g transform="translate(17.5 6.5) scale(1.1)"><path class="st s1" d="${STAR}"/></g><g transform="translate(21 3.5) scale(.7)"><path class="st s2" d="${STAR}"/></g><g transform="translate(14.5 3) scale(.6)"><path class="st s3" d="${STAR}"/></g></svg>`;
  const AUTO=`<svg class="auto" viewBox="0 0 24 24" aria-hidden="true"><g class="half"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" style="fill:currentColor"/></g></svg>`;
  const BOLT=`<svg class="zap" viewBox="0 0 24 24" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`;
  const ICON={light:SUN,dark:MOON,auto:AUTO,lite:BOLT};
  let cur="auto";try{const sv=localStorage.getItem("theme");if(sv==="light"||sv==="dark")cur=sv}catch(e){}
  const paint=()=>{$("thb").innerHTML=ICON[cur];document.querySelectorAll(".opt").forEach(b=>{b.innerHTML=ICON[b.dataset.v];b.classList.toggle("on",b.dataset.v==="lite"?document.documentElement.classList.contains("lite"):b.dataset.v===cur)})};
  window.paintTheme=paint;
  const closePop=()=>{$("thp").hidden=true;$("thb").setAttribute("aria-expanded","false")};
  $("thb").onclick=e=>{e.stopPropagation();const open=$("thp").hidden;$("thp").hidden=!open;$("thb").setAttribute("aria-expanded",String(open))};
  document.addEventListener("click",e=>{if(!$("thm").contains(e.target))closePop()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closePop()});
  document.querySelectorAll(".opt").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const v=b.dataset.v;
    if(v==="lite"){
      const on=!document.documentElement.classList.contains("lite");
      document.documentElement.classList.toggle("lite",on);
      try{localStorage.setItem("lite",on?"1":"0")}catch(x){}
      paint();const z=b.querySelector("svg");z.classList.remove("play");void z.getBoundingClientRect();z.classList.add("play");
      setTimeout(closePop,850);return;
    }
    cur=v;
    try{v==="auto"?localStorage.removeItem("theme"):localStorage.setItem("theme",v)}catch(x){}
    const r=document.documentElement;v==="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",v);
    paint();
    const svg=b.querySelector("svg");svg.classList.remove("play");void svg.getBoundingClientRect();svg.classList.add("play");
    setTimeout(closePop,850);
  });
  paint();
}

async function shrink(file){
  const bmp=await createImageBitmap(file);
  let max=1100,q=.72,out="";
  for(let i=0;i<7;i++){
    const sc=Math.min(1,max/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);
    const c=document.createElement("canvas");c.width=w;c.height=h;
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(bmp,0,0,w,h);
    out=c.toDataURL("image/jpeg",q);
    if(out.length<270000)break;
    q=Math.max(.4,q-.08);max=Math.round(max*.85);
  }
  if(bmp.close)bmp.close();
  return out.length<300000?out:null;
}

  const postedCard=`<div class="card"><b>Posted updates</b>${posted.length?posted.map(([k,v])=>{const[c,dd]=k.split("_"),cc=COURSES.find(x=>x[0].replace(" ","")===c);return `<div class="row" style="margin:8px 0;font-size:14px"><span>${cc?cc[0]:c} · ${dd===td0?"Today":dd===ymd(addDays(1))?"Tomorrow":dd}<br><small>${KL[v.kind]||""}${v.st?" · "+f12(v.st)+" to "+f12(v.en):""}</small></span><span><button class="b h" style="background:none;cursor:pointer" data-ed="${esc(k)}">Edit</button> <button class="b c" style="background:none;cursor:pointer" data-del="${esc(k)}">Delete</button></span></div>`}).join(""):"<p class=sub>Nothing posted yet.</p>"}</div>`;
  el.innerHTML=`<div class="card"><b>Post class status</b>
<select id="pc">${opts}</select>
<select id="pk"><option value="h">Class is holding</option><option value="c">Class cancelled</option><option value="m">Class moved</option></select>
<small>Class date</small><input id="pd" type="date" min="${ymd(new Date())}" value="${pdate>=ymd(new Date())?pdate:ymd(new Date())}">
<small>Starts</small>${tsel("pst")}
<small>Ends</small>${tsel("pen")}
<input id="pn" placeholder="Note (new time, venue, reason)">
<input id="pb" placeholder="Your name or title (e.g. Dr Adekunjo)">
<button class="btn" id="ps">Post</button>${share?`<a class="btn" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(share)}">Share to WhatsApp</a>`:""}<div class="msg" id="pm1"></div></div>
${postedCard}
<div class="card"><b>Add course material</b>
<select id="mc">${opts}</select>
<select id="mk">${CATS.map(c=>`<option>${c}</option>`).join("")}</select>
<input id="mti" placeholder="Title (e.g. 2023/2024 exam questions)">
<input id="mle" placeholder="Lecturer or topic (optional)">
<input id="mli" placeholder="Paste the Google Drive link" inputmode="url" autocapitalize="off">
<button class="btn" id="ma">Add material</button><div class="msg" id="mmsg"></div>
<p class="sub">In Google Drive: open the file or folder, tap Share, set General access to “Anyone with the link”, then copy the link.</p></div>
<div class="card"><b>Add deadline or test</b>
<select id="dlc">${opts}</select>
<select id="dlk">${DTYPES.map(c=>`<option>${c}</option>`).join("")}</select>
<input id="dlti" placeholder="Title (e.g. Test 1, Assignment 2)">
<small>Date</small><input id="dlde" type="date" min="${ymd(new Date())}">
<small>Time (optional)</small>${tsel("dlt")}
<input id="dlno" placeholder="Note or venue (optional)">
<textarea id="dltx" rows="4" maxlength="2000" placeholder="Assignment question or details (optional). Type short questions here."></textarea>
<input id="dllk" placeholder="Link, e.g. Google Drive (optional)" inputmode="url" autocapitalize="off">
<label class="btn s" style="display:block;text-align:center;cursor:pointer;margin:5px 0">Add pictures (up to 3)<input id="dlfile" type="file" accept="image/*" multiple hidden></label>
<div id="dlthumbs" style="display:flex;gap:10px;flex-wrap:wrap;margin:6px 0"></div>
<button class="btn" id="dlad">Save</button><div class="msg" id="dlmsg"></div></div>
<div class="card"><b>Open attendance</b>
<select id="sc">${opts}</select>
<button class="btn" id="so">Start 3-minute session</button>
${newCode?`<p class="sub" style="text-align:center">Show this code in class</p><div class="code">${newCode}</div>`:""}
<div class="msg" id="pm2"></div></div>
<div class="card"><b>Today’s sessions</b>${sessions.length?sessions.map(s=>{const rs=atts.filter(a=>a.sid===s.id).sort((a,b)=>a.t-b.t);return `<div class="row" style="margin-top:8px"><div>${s.course}<br><small>${tm(+s.id)} · ${rs.length} present</small></div><button class="btn s" style="width:auto" data-x="${s.id}">Export</button></div>`+rs.map(r=>`<div class="row" style="margin:4px 0;font-size:14px"><span>${esc(r.name)} <small>${esc(r.matric)}</small></span><button class="b c" style="background:none;cursor:pointer" data-r="${esc(r.id)}">Remove</button></div>`).join("")}).join(""):"<p class=sub>None yet.</p>"}</div>
<div class="card"><b>Class list</b><p class="sub">${roster.filter(r=>r.status==="approved").length} approved · ${pend.length} waiting</p><button class="btn s" id="st2">${strict?"Approval required to sign: ON (tap to turn off)":"Approval required to sign: OFF (tap to turn on)"}</button>${pend.length?`<button class="btn s" id="aa">Approve all waiting</button>`:""}${pend.map(r=>`<div class="row" style="margin:6px 0;font-size:14px"><span>${esc(r.name)} <small>${esc(r.matric)}</small></span><span><button class="b h" style="background:none;cursor:pointer" data-ok="${esc(r.id)}">Approve</button> <button class="b c" style="background:none;cursor:pointer" data-no="${esc(r.id)}">Reject</button></span></div>`).join("")}</div>
<div class="card"><b>Change poster code</b>${me?`<p class="sub">Signed in as ${esc(me.email||"owner")}</p><input id="cn" type="password" placeholder="New poster code"><button class="btn s" id="cc">Change code</button>`:`<p class="sub">Only the owner can change the code. Sign in with the owner’s Google account.</p><button class="btn s" id="so2">Owner sign-in with Google</button>`}<div class="msg">${cmsg}</div></div>`;
  KEEP.forEach(id=>{if(saved[id]!==undefined&&$(id))$(id).value=saved[id]});
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>updateDoc(D("config/board"),{[b.dataset.del]:deleteField()}));
  el.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.ed,v=board[k];if(!v)return;
    const[c,dd]=k.split("_"),cc=COURSES.find(x=>x[0].replace(" ","")===c);
    if(cc)$("pc").value=cc[0];
    $("pd").value=dd;$("pk").value=v.kind;$("pn").value=v.note||"";$("pb").value=v.by||"";
    ["pst","pen"].forEach((id,i)=>{const t=i?v.en:v.st;if(t){const[h,m]=t.split(":"),n=+h;$(id+"h").value=String(n%12||12);$(id+"m").value=m;$(id+"a").value=n<12?"AM":"PM"}else{$(id+"h").value="";$(id+"m").value="";$(id+"a").value="AM"}});
    $("pm1").textContent="Editing "+(cc?cc[0]:c)+". Change what you need, then tap Post.";
    $("pc").scrollIntoView({behavior:"smooth",block:"center"});
  });
  drawThumbs();
  $("dlfile").onchange=async e=>{
    const files=[...e.target.files];e.target.value="";
    for(const f of files){
      if(dlImgs.length>=3){$("dlmsg").textContent="Up to 3 pictures per item.";break}
      $("dlmsg").textContent="Preparing picture…";
      try{const d=await shrink(f);if(!d)throw 0;dlImgs.push(d)}catch(x){$("dlmsg").textContent="Couldn’t use that picture. Try another one.";return}
    }
    $("dlmsg").textContent="";drawThumbs();
  };
  $("dlad").onclick=async()=>{
    const m=$("dlmsg"),course=$("dlc").value,type=$("dlk").value,title=$("dlti").value.trim(),due=$("dlde").value,note=$("dlno").value.trim(),time=tget("dlt");
    if(!title||!due){m.textContent="Add a title and a date.";return}
    if(time==="bad"){m.textContent="Pick the hour and the minute, or leave the time empty.";return}
    const text=$("dltx").value.trim().slice(0,2000),link=$("dllk").value.trim();
    if(link&&!safeUrl(link)){m.textContent="The link must start with https://";return}
    const id=dlEditId||"d"+Date.now(),item={course,type,title,due,note,t:Date.now()};
    if(time)item.time=time;if(text)item.text=text;if(link)item.link=link;
    const hadImg=dlEditId&&dl[dlEditId]&&dl[dlEditId].img;
    if(dlImgs.length)item.img=dlImgs.length;
    const upd={[id]:item},cut=ymd(addDays(-14));
    Object.entries(dl).forEach(([k,v])=>{if(v&&v.due&&v.due<cut){upd[k]=deleteField();if(v.img)deleteDoc(D("config/dlimg_"+k)).catch(()=>{})}});
    try{
      if(dlImgs.length){const o={n:dlImgs.length};dlImgs.forEach((u,i)=>o["i"+i]=u);await setDoc(D("config/dlimg_"+id),o);imgCache[id]=[...dlImgs]}
      else if(hadImg){await deleteDoc(D("config/dlimg_"+id));delete imgCache[id]}
      try{await updateDoc(D("config/deadlines"),upd)}catch(x){await setDoc(D("config/deadlines"),{[id]:item})}
      dl[id]=item;dlReady=true;dlEditId=null;$("dlti").value="";$("dlno").value="";$("dltx").value="";$("dllk").value="";dlImgs=[];drawThumbs();
      m.textContent="Saved.";renderStatus();
    }catch(e){m.textContent="Couldn’t save. Check your connection."}
  };
  $("ma").onclick=async()=>{
    const code=$("mc").value,cat=$("mk").value,title=$("mti").value.trim(),lec=$("mle").value.trim(),link=$("mli").value.trim(),m=$("mmsg");
    if(!title||!link){m.textContent="Add a title and a link.";return}
    if(!safeUrl(link)){m.textContent="The link must start with https://";return}
    const id="m"+Date.now(),item={cat,title,lec,link,t:Date.now()};
    try{
      await setDoc(D("config/mat_"+mkey(code)),{[id]:item},{merge:true});
      if(mcache[code])mcache[code][id]=item;
      $("mti").value="";$("mli").value="";m.textContent="Added to "+code+".";
    }catch(e){m.textContent="Couldn’t add it. Check your connection."}
  };
  $("ps").onclick=async()=>{
    const t=Date.now();
    const st=tget("pst"),en=tget("pen"),kd=$("pk").value;
    if(kd!=="c"&&(st==="bad"||en==="bad")){$("pm1").textContent="Pick the hour and the minute for both times.";return}
    if(kd!=="c"&&(st||en)&&(!st||!en||en<=st)){$("pm1").textContent="Set both a start and an end time, with the end after the start.";return}
    const e={kind:kd,note:$("pn").value.trim(),by:$("pb").value.trim(),t};
    if(kd!=="c"&&st){e.st=st;e.en=en}
    const dt=$("pd").value,td=ymd(new Date());
    if(!dt||dt<td){$("pm1").textContent="Pick today or a future date.";return}
    pdate=dt;
    const key=$("pc").value.replace(" ","")+"_"+dt,ref=D("config/board");
    const upd={[key]:e};
    Object.keys(board).forEach(k2=>{const dd=k2.split("_")[1];if(!dd||dd<td)upd[k2]=deleteField()});
    try{await updateDoc(ref,upd)}catch(x){await setDoc(ref,{[key]:e})}
    const c=COURSES.find(x=>x[0]===$("pc").value),k={h:"is holding",c:"is CANCELLED",m:"has MOVED"}[$("pk").value],n=$("pn").value.trim();
    share=`📢 ${c[0]} (${c[1]}) ${k} ${dt===td?"today":dt===ymd(addDays(1))?"tomorrow":"on "+dayName(new Date(dt+"T12:00:00"))}${st&&kd!=="c"?" from "+f12(st)+" to "+f12(en):""}.${n?"\n"+n:""}\nAll updates: ${location.origin+location.pathname}`;
    $("pn").value="";renderPoster();$("pm1").textContent="Posted. Tap Share to WhatsApp to tell the class group.";
  };
  $("so").onclick=async()=>{
    const t=Date.now(),code=String(Math.floor(1000+Math.random()*9000));
    await setDoc(D("sessions/"+t),{course:$("sc").value,code,exp:t+180000,t});
    newCode=code;renderPoster();
  };
  el.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{
    const s=sessions.find(x=>x.id===b.dataset.x),rows=atts.filter(a=>a.sid===s.id).sort((a,b)=>a.t-b.t);
    const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
    const csv=["Course,Date,No.,Name,Matric,Time"].concat(rows.map((r,i)=>[s.course,new Date(+s.id).toLocaleDateString(),i+1,q(r.name),q(r.matric),tm(r.t)].join(","))).join("\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download=`${s.course.replace(" ","")}_attendance_${new Date(+s.id).toISOString().slice(0,10)}.csv`;a.click();
  });
  el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>deleteDoc(D("att/"+b.dataset.r)));
  $("st2").onclick=()=>setDoc(D("config/rules"),{strict:!strict});
  if($("aa"))$("aa").onclick=async()=>{for(const r of pend)await updateDoc(D("roster/"+r.id),{status:"approved"})};
  el.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>updateDoc(D("roster/"+b.dataset.ok),{status:"approved"}));
  el.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>deleteDoc(D("roster/"+b.dataset.no)));
  if($("so2"))$("so2").onclick=async()=>{
    try{const {m,a}=await loadAuth();await m.signInWithPopup(a,new m.GoogleAuthProvider());cmsg=""}
    catch(x){cmsg="Sign-in didn’t complete. Try again."}
    renderPoster();
  };
  if($("cc"))$("cc").onclick=async()=>{
    const v=$("cn").value.trim();
    if(v.length<4){cmsg="Use at least 4 characters.";renderPoster();return}
    try{await setDoc(D("config/poster"),{pin:v});cmsg="Code changed. Share the new one with your posters."}
    catch(x){cmsg="Only the owner can change the code."}
    renderPoster();
  };
}

$("as").onclick=async()=>{
  const m=$("amsg"),course=$("ac").value,name=$("an").value.trim(),mat=$("am").value.trim().toUpperCase(),code=$("ak").value.trim();
  if(!db){m.textContent="App isn’t connected yet.";return}
  if(!name||!mat||!code){m.textContent="Fill in every box.";return}
  m.textContent="Checking…";
  try{
    const q=await getDocs(query(collection(db,"sessions"),where("code","==",code),where("course","==",course)));
    const s=list(q).filter(x=>Date.now()<x.exp).sort((a,b)=>b.t-a.t)[0];
    if(!s){m.textContent="Invalid or expired code for this course.";return}
    const id=idOf(mat),rs=await getDoc(D("config/rules")),need=rs.exists()&&rs.data().strict===true;
    let nm=name;
    if(need){
      const r=await getDoc(D("roster/"+id));
      if(!r.exists()||r.data().status!=="approved"){m.textContent="Your matric number isn’t approved yet. Register below and ask a course rep.";return}
      nm=r.data().name;
    }
    let dev="";try{dev=localStorage.getItem("dev")||"";if(!dev){dev=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("dev",dev)}}catch(e){}
    if(dev){
      const dq=await getDocs(query(collection(db,"att"),where("sid","==",s.id),where("dev","==",dev)));
      if(!dq.empty){m.textContent="This phone has already signed for this class.";return}
    }
    const ref=D("att/"+s.id+"_"+id);
    if((await getDoc(ref)).exists()){m.textContent="This matric number has already signed.";return}
    await setDoc(ref,{sid:s.id,course,name:nm,matric:mat,dev,t:Date.now()});
    m.textContent="You’re marked present for "+course+".";
  }catch(e){m.textContent="Something went wrong. Check your connection and try again."}
};

$("rs").onclick=async()=>{
  const m=$("rmsg"),name=$("rn").value.trim(),mat=$("rm").value.trim().toUpperCase();
  if(!db){m.textContent="App isn’t connected yet.";return}
  if(!name||!mat){m.textContent="Fill in both boxes.";return}
  try{
    const ref=D("roster/"+idOf(mat)),ex=await getDoc(ref);
    if(ex.exists()){m.textContent=ex.data().status==="approved"?"You’re already approved.":"Already registered. Waiting for approval.";return}
    await setDoc(ref,{name,matric:mat,status:"pending",t:Date.now()});
    m.textContent="Registered. A course rep will approve you.";
  }catch(e){m.textContent="Something went wrong. Try again."}
};

async function loadAuth(){
  if(AU)return AU;
  const m=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js");
  const a=m.getAuth(fbApp);
  m.onAuthStateChanged(a,u=>{me=u;renderPoster()});
  AU={m,a};return AU;
}
const err=()=>{warn("Can’t reach the database. Check your connection.");hideSplash()};
// Only posters listen to the big collections, so students use very few database reads.
function startPoster(){
  if(startPoster.on)return;startPoster.on=true;
  const today=c=>query(collection(db,c),where("t",">=",t0));
  onSnapshot(today("sessions"),s=>{sessions=list(s).sort((a,b)=>b.t-a.t);renderPoster()},err);
  onSnapshot(today("att"),s=>{atts=list(s);renderPoster()},err);
  onSnapshot(collection(db,"roster"),s=>{roster=list(s);renderPoster()},err);
  onSnapshot(D("config/rules"),d=>{strict=d.exists()&&d.data().strict===true;renderPoster()},err);
  loadAuth().catch(()=>{});
}
async function startDL(){await loadDL();renderStatus()}

renderStatus();
try{
  if(String(firebaseConfig.apiKey).includes("PASTE"))throw new Error("config");
  fbApp=initializeApp(firebaseConfig);db=getFirestore(fbApp);
  startDL();
  onSnapshot(D("config/board"),d=>{board=d.exists()?d.data():{};boardReady=true;if($("warn").textContent.startsWith("Still"))$("warn").hidden=true;renderStatus();hideSplash()},err);
}catch(e){warn("Setup not finished: the Firebase details in firebase-config.js are missing.");hideSplash()}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
